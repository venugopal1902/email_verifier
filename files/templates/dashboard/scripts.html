<script>
    // ==========================================
    // 1. CONFIG & UTILITIES
    // ==========================================
    const API_CREDITS = '/api/v1/credits/';
    const API_BASE = '/api/v1/upload/';
    const HISTORY_URL = '/api/v1/history/';
    const LIST_UPLOAD_URL = '/api/v1/lists/'; 

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
    const csrftoken = getCookie('csrftoken');

    function toggleTheme() {
        const html = document.documentElement;
        const isDark = html.classList.toggle('dark');
        document.getElementById('theme-icon').textContent = isDark ? '☀️' : '🌙';
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }
    if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('dark');
        document.getElementById('theme-icon').textContent = '☀️';
    }

    // ==========================================
    // 2. DATA FETCHING (Fixed Auth)
    // ==========================================
    async function fetchCredits() {
        try {
            const response = await fetch(API_CREDITS, {
                method: 'GET',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include' // <--- USES COOKIE INSTEAD OF TOKEN
            });
            if (response.ok) {
                const data = await response.json();
                const el = document.getElementById('credit-balance');
                if (el) el.innerText = data.credits;
            }
        } catch (error) {
            console.error('Error fetching credits:', error);
        }
    }

    async function fetchData() {
        // This function is called after upload to refresh history
        // If your history table is server-side rendered, simple reload works best
        setTimeout(() => location.reload(), 1000); 
    }

    // ==========================================
    // 3. FILE UPLOAD LOGIC
    // ==========================================
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('file-upload');

    // Setup Drag & Drop
    if (dropzone) {
        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('border-blue-500', 'bg-blue-50', 'dark:bg-slate-700');
        });
        dropzone.addEventListener('dragleave', () => {
            dropzone.classList.remove('border-blue-500', 'bg-blue-50', 'dark:bg-slate-700');
        });
        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('border-blue-500', 'bg-blue-50', 'dark:bg-slate-700');
            if (e.dataTransfer.files.length) handleUpload(e.dataTransfer.files[0]);
        });
    }
    
    if (fileInput) {
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleUpload(e.target.files[0]);
        });
    }

    async function handleUpload(file) {
        const formData = new FormData();
        formData.append('file', file);

        const statusEl = document.getElementById('upload-status');
        if (statusEl) statusEl.innerHTML = '<span class="text-blue-500">Uploading...</span>';

        try {
            const response = await fetch(API_BASE, {
                method: 'POST',
                headers: {
                    'X-CSRFToken': csrftoken // <--- REQUIRED FOR DJANGO POST
                },
                body: formData,
                credentials: 'include' // <--- USES COOKIE
            });

            if (response.ok) {
                if (statusEl) statusEl.innerHTML = '<span class="text-green-600">Started!</span>';
                fetchData(); // Reload page
            } else {
                const err = await response.json();
                if (statusEl) statusEl.innerHTML = `<span class="text-red-600">Failed: ${err.detail || 'Error'}</span>`;
            }
        } catch (err) {
            console.error(err);
            if (statusEl) statusEl.innerHTML = '<span class="text-red-600">Network Error</span>';
        }
    }

    // ==========================================
    // 4. SUPPRESSION LIST LOGIC (Restored)
    // ==========================================
    const suppForm = document.getElementById('suppressionForm');
    if (suppForm) {
        suppForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileEl = document.getElementById('suppressionFile');
            if (!fileEl.files.length) return;

            const formData = new FormData();
            formData.append('file', fileEl.files[0]);
            
            const statusEl = document.getElementById('suppression-status');
            if (statusEl) statusEl.innerHTML = 'Processing...';

            try {
                const listType = document.getElementById('listType').value;
                const res = await fetch(`${LIST_UPLOAD_URL}${listType}/`, { 
                    method: 'POST', 
                    headers: { 
                        'X-CSRFToken': csrftoken 
                    }, 
                    body: formData,
                    credentials: 'include' 
                });
                
                const data = await res.json();
                if (res.ok) {
                    if (statusEl) statusEl.innerHTML = `<span class="text-green-600">Success! Added.</span>`;
                } else {
                    if (statusEl) statusEl.innerHTML = `<span class="text-red-600">Error: ${data.detail || 'Failed'}</span>`;
                }
            } catch (err) {
                if (statusEl) statusEl.innerHTML = 'Network Error';
            }
        });
    }

    // ==========================================
    // 5. INIT
    // ==========================================
    document.addEventListener('DOMContentLoaded', () => {
        fetchCredits();
    });
</script>
